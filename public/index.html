<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Pago</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Formulario de Pago</h1>
  
  <form id="pagoForm">
    <label for="destinatario">Destinatario:</label>
    <input type="text" id="destinatario" name="destinatario" value="FRANCISCO JAVIER CEDILLO SOLARES" required>

    <label for="monto">Monto:</label>
    <input type="number" id="monto" name="monto" required>

    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" name="descripcion" required>

    <label for="tipoTarjeta">Tipo de tarjeta:</label>
    <select id="tipoTarjeta" name="tipoTarjeta" required>
      <option value="visa">Visa</option>
      <option value="mastercard">MasterCard</option>
      <option value="amex">American Express</option>
    </select>

    <label for="numeroTarjeta">Número de tarjeta (PAN):</label>
    <input type="text" id="numeroTarjeta" name="numeroTarjeta" maxlength="19" required>

    <label for="fechaVencimiento">Fecha de vencimiento (MM/AA):</label>
    <input type="text" id="fechaVencimiento" name="fechaVencimiento" placeholder="MM/AA" required>

    <label for="cvv">Código de seguridad (CVV/CVC):</label>
    <input type="text" id="cvv" name="cvv" maxlength="4" required>

    <label for="nombreTitular">Nombre del titular:</label>
    <input type="text" id="nombreTitular" name="nombreTitular" required>

    <label for="documentoTitular">Documento de identidad:</label>
    <input type="text" id="documentoTitular" name="documentoTitular" required>

    <button type="submit">Enviar Pago</button>
  </form>

  <div style="text-align: center; margin-bottom: 50px;">
    <a href="historial.html" style="background-color: #34495e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">Ver Historial de Pagos</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
